name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build And Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Zig Cache Dirs
        run: |
          mkdir -p "${{ runner.temp }}/zig-global-cache"
          mkdir -p "${{ runner.temp }}/zig-global-cache/tmp"
          mkdir -p "${{ github.workspace }}/.zig-cache"
          mkdir -p "${{ github.workspace }}/.zig-cache/tmp"
          mkdir -p "${{ github.workspace }}/zig-pkg"

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Check Formatting
        run: zig fmt --check build.zig build.zig.zon src tests

      - name: Run Tests
        run: zig build test --summary all
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

  windows-build:
    name: Build And Smoke Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Zig Cache Dirs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/zig-global-cache" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/zig-global-cache/tmp" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/.zig-cache" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/.zig-cache/tmp" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/zig-pkg" -Force | Out-Null

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Build ReleaseSafe
        shell: pwsh
        run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Smoke Test Portable Path
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP "portable-smoke"
          $probeDir = Join-Path $probeRoot "probe"
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          $realExe = (Resolve-Path "zig-out/bin/pxlobster.exe").ProviderPath
          $probeExe = Join-Path $probeDir "pxlobster.exe"

          Copy-Item $realExe $probeExe -Force
          if (-not (Test-Path $probeExe)) {
            throw "Probe EXE was not copied to $probeExe"
          }

          & $realExe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Direct EXE --help failed with exit code $LASTEXITCODE"
          }

          & $probeExe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Relocated EXE --help failed with exit code $LASTEXITCODE"
          }
